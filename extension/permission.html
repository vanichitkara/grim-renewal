<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Allow the Reaper</title>
<link rel="stylesheet" href="ui.css"></head><body>
<h1>The Reaper asks first</h1>
<p><strong id="app"></strong> wants to open <strong id="site"></strong> and click its cancel buttons, only after you approve each click.</p>
<p class="small">It never types and never reads your passwords. The permission is removed when the run ends. You can also remove it in chrome://extensions.</p>
<button id="allow" type="button">Allow this site</button>
<button id="deny" type="button" class="ghost">Not now</button>
<script src="permission.js"></script>
</body></html>
